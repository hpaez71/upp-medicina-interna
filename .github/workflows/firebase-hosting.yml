# Publica la carpeta docs/ en Firebase Hosting (https://proyecto-upp-244d7.web.app)
# cada vez que se sube un cambio a la rama main. Requiere el secreto FIREBASE_SERVICE_ACCOUNT
# (llave JSON de una cuenta de servicio con el rol Administrador de Firebase Hosting).
name: Publicar en Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publicar en Firebase Hosting
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::Falta el secreto FIREBASE_SERVICE_ACCOUNT"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          if ! python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print('Cuenta:', d['client_email'])" "$RUNNER_TEMP/sa.json"; then
            echo "::error::El secreto FIREBASE_SERVICE_ACCOUNT no es un JSON válido. Péguelo completo, desde { hasta }."; exit 1; fi
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set +e
          npx --yes firebase-tools@13 deploy --only hosting --project proyecto-upp-244d7 --non-interactive 2>&1 | tee "$RUNNER_TEMP/out.txt"
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" != "0" ]; then
            grep -iE "error|denied|permission|not found|has not been used|disabled" "$RUNNER_TEMP/out.txt" | head -8 | while IFS= read -r l; do echo "::error::$l"; done
            exit "$code"
          fi
          echo "::notice::Publicado en https://proyecto-upp-244d7.web.app"
